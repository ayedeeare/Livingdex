<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Dex — where and how</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b3440">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --hull:#2b3440; --hull-deep:#1c232b; --hull-line:#3a4653;
    --screen:#edf0e8; --screen-dim:#dde2d8; --ink:#212831; --ink-soft:#5d6874;
    --aqua:#3f93a2; --aqua-deep:#2c6f7c; --amber:#c8912f; --done:#8d97a3;
    --blocked:#a8574b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--hull-deep);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);padding:12px;-webkit-font-smoothing:antialiased;}
  .unit{max-width:680px;margin:0 auto;}

  .top-screen{background:var(--hull);border:1px solid var(--hull-line);border-radius:3px;
    padding:6px;position:sticky;top:0;z-index:5;}
  .lcd{background:var(--screen);border-radius:2px;padding:14px 14px 12px;
    background-image:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,0) 45%);}
  .eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-soft);}
  .headline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:7px;}
  .big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:600;
    line-height:.9;letter-spacing:-.03em;}
  .of{font-size:12px;color:var(--ink-soft);line-height:1.35;}
  .days{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--amber);
    margin-left:auto;text-align:right;line-height:1.4;white-space:pre-line;}
  .segbar{display:flex;gap:1px;margin-top:10px;height:10px;}
  .seg{flex:1 1 0;background:var(--screen-dim);border-radius:1px;}

  .controls{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
  #q{flex:1 1 140px;min-width:0;padding:7px 9px;border:1px solid var(--screen-dim);
    border-radius:2px;background:#fff;font:inherit;font-size:14px;color:var(--ink);}
  #q:focus{outline:2px solid var(--aqua-deep);outline-offset:-1px;}
  select{padding:7px 8px;border:1px solid var(--screen-dim);border-radius:2px;background:#fff;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);}
  .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:7px 9px;border:1px solid var(--screen-dim);
    border-radius:2px;background:#fff;color:var(--ink-soft);cursor:pointer;}
  .chip.on{background:var(--aqua);border-color:var(--aqua);color:#fff;}
  .chip:focus-visible,select:focus-visible{outline:2px solid var(--aqua-deep);outline-offset:2px;}

  .bottom-screen{background:var(--hull);border:1px solid var(--hull-line);border-top:none;
    border-radius:0 0 3px 3px;padding:0 6px 6px;}
  .hinge{height:11px;display:flex;align-items:center;justify-content:center;gap:5px;}
  .hinge span{width:24px;height:2px;background:var(--hull-line);border-radius:2px;}
  .panel{background:var(--screen);border-radius:2px;padding:2px 0 6px;min-height:130px;}

  .gen{width:100%;border:none;background:none;font:inherit;color:inherit;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 15px;text-align:left;border-bottom:1px solid var(--screen-dim);}
  .gen:hover{background:rgba(63,147,162,.07);}
  .gen:focus-visible{outline:2px solid var(--aqua-deep);outline-offset:-2px;}
  .gen-t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;font-weight:600;}
  .gen-r{font-size:10px;color:var(--ink-soft);margin-left:7px;letter-spacing:0;
    text-transform:none;font-weight:400;}
  .gen-c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);}

  .rows{display:none;} .rows.open{display:block;}
  .row{display:flex;gap:9px;padding:10px 15px;cursor:pointer;align-items:flex-start;
    border:none;background:none;width:100%;text-align:left;font:inherit;color:inherit;
    border-bottom:1px solid rgba(221,226,216,.55);}
  .row:hover{background:rgba(63,147,162,.06);}
  .row:focus-visible{outline:2px solid var(--aqua-deep);outline-offset:-2px;}
  .box{flex:0 0 15px;width:15px;height:15px;margin-top:2px;border:1.5px solid var(--ink-soft);
    border-radius:2px;display:flex;align-items:center;justify-content:center;}
  .row.done .box{background:var(--aqua);border-color:var(--aqua);}
  .box svg{width:9px;height:9px;opacity:0;} .row.done .box svg{opacity:1;}
  .body{flex:1;min-width:0;}
  .name{font-size:14px;line-height:1.3;}
  .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);
    margin-right:7px;}
  .row.done .name,.row.done .num{color:var(--done);text-decoration:line-through;
    text-decoration-thickness:1px;}

  .where{margin-top:5px;font-size:12px;line-height:1.5;}
  .gm{display:block;margin-top:3px;}
  .gm b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--aqua-deep);margin-right:5px;}
  .gm span{color:var(--ink-soft);}
  .hop{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;
    font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:#7a6a4a;
    background:#efe9da;border-radius:2px;padding:1px 4px;margin-right:5px;}
  .excl{display:inline-block;margin-top:5px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8a5a12;
    background:#f6e6c4;border:1px solid #e0c68d;border-radius:2px;padding:2px 5px;line-height:1.3;}
  .row.done .excl{opacity:.5;}
  .evo{display:block;margin-top:4px;font-size:12px;color:var(--aqua-deep);line-height:1.45;}
  .blk{display:block;margin-top:4px;font-size:12px;color:var(--blocked);line-height:1.45;}
  .spc{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft);line-height:1.45;}
  .row.done .where,.row.done .evo,.row.done .spc{opacity:.5;}

  .empty{padding:26px 15px;font-size:13px;color:var(--ink-soft);line-height:1.55;}
  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 2px 4px;flex-wrap:wrap;}
  .status{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:#6d7885;}
  .reset{background:none;border:1px solid var(--hull-line);color:#8a94a1;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:6px 10px;border-radius:2px;cursor:pointer;}
  .reset:hover{border-color:var(--amber);color:var(--amber);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

  <div class="bottom-screen">
    <div class="hinge"><span></span><span></span><span></span></div>

  </div>
  <footer>
    <div class="status" id="status">&nbsp;</div>
    <span style="display:flex;gap:6px;">
      <button class="reset" id="backup">Save a backup</button>
      <button class="reset" id="reset">Clear all</button>
    </span>
  </footer>
</div>

const KEY = "livingdex:v2";
const TOTAL = 807;
const TICK = '<svg viewBox="0 0 12 12" fill="none" stroke="#edf0e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4l2.6 2.6L10 3.4"/></svg>';
let caught = new Set(), filter = "all", query = "", gameF = "", open = new Set([1]);
const $ = id => document.getElementById(id);
const ROUTE = {
  vc:'<i class="hop">Transporter</i>', gen5:'<i class="hop">Transporter</i>',
  gen4:'<i class="hop">via Gen 5</i>', gba:'<i class="hop">Pal Park + dual-slot DS</i>'};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

const daysLeft = () => Math.max(0,
  Math.ceil((new Date("2027-02-25T19:00:00-08:00") - new Date())/86400000));
const setStatus = m => { $("status").textContent = m || "\u00a0"; };

async function save(){
  const val = JSON.stringify([...caught]);
  try{
    if(window.storage && window.storage.set){ await window.storage.set(KEY, val); }
    else { localStorage.setItem(KEY, val); }
    setStatus("Saved");
  }catch(e){
    try{ localStorage.setItem(KEY, val); setStatus("Saved"); }
    catch(e2){ setStatus("Can't save here \u2014 open the hosted copy"); }
  }
}
async function load(){
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get(KEY);
      if(r && r.value){ caught = new Set(JSON.parse(r.value)); return; }
    }
  }catch(e){}
  try{
    const v = localStorage.getItem(KEY);
    if(v) caught = new Set(JSON.parse(v));
  }catch(e){}
}
function exportProgress(){
  const blob = new Blob([JSON.stringify([...caught])], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "living-dex-progress.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function visible(it){
  if(filter === "left" && caught.has(it.i)) return false;
  if(filter === "blocked" && !it.b) return false;
  if(gameF){
    const pair = {"Ultra Sun":"USUM","Ultra Moon":"USUM","Sun":"Sun/Moon","Moon":"Sun/Moon",
      "X":"X/Y","Y":"X/Y","Omega Ruby":"ORAS","Alpha Sapphire":"ORAS",
      "Black 2":"Black 2/White 2","White 2":"Black 2/White 2",
      "Black":"Black/White","White":"Black/White",
      "Diamond":"Diamond/Pearl","Pearl":"Diamond/Pearl",
      "HeartGold":"HeartGold/SoulSilver","SoulSilver":"HeartGold/SoulSilver",
      "Ruby":"Ruby/Sapphire","Sapphire":"Ruby/Sapphire",
      "FireRed":"FireRed/LeafGreen","LeafGreen":"FireRed/LeafGreen",
      "Red":"Red/Blue","Blue":"Red/Blue","Gold":"Gold/Silver","Silver":"Gold/Silver"}[gameF];
    if(!(it.L || []).some(p => p[0] === gameF || p[0] === pair)) return false;
  }
  if(query){
    const q = query.toLowerCase();
    if(!it.n.toLowerCase().includes(q) && String(it.i) !== q) return false;
  }
  return true;
}

function updateTop(){
  const n = caught.size;
  $("count").textContent = n;
  $("pct").textContent = (n/TOTAL*100).toFixed(1) + "% complete";
  $("days").textContent = daysLeft() + " days\nuntil Bank closes";
  const bar = $("segbar");
  if(bar.children.length !== DEX.length){
    bar.innerHTML = "";
    DEX.forEach(() => bar.appendChild(document.createElement("div")));
  }
  DEX.forEach((g,i) => {
    const c = g.items.filter(it => caught.has(it.i)).length;
    bar.children[i].className = "seg";
    bar.children[i].style.background =
      "linear-gradient(to right, var(--aqua) " + (c/g.items.length*100) + "%, var(--screen-dim) 0)";
  });
}

function detail(it){
  let h = "";
  if(it.x && it.x.length){
    h += '<span class="excl">' + esc(it.x.join(" / ")) + ' only \u2014 not in the other version</span>';
  }
  if(it.L && it.L.length){
    h += '<span class="where">' + it.L.map(p =>
      '<span class="gm"><b>' + esc(p[0]) + '</b>' + (ROUTE[p[2]] || "") +
      '<span>' + esc(p[1].join(" · ")) + '</span></span>').join("") + '</span>';
  }
  if(it.e) h += '<span class="evo">' + esc(it.e) + '</span>';
  if(it.b) h += '<span class="blk">' + esc(it.b) + '</span>';
  if(it.s) h += '<span class="spc">' + esc(it.s) + '</span>';
  return h;
}

function render(){
  const panel = $("panel");
  panel.innerHTML = "";
  let shown = 0;
  DEX.forEach(g => {
    const vis = g.items.filter(visible);
    if(!vis.length) return;
    shown += vis.length;
    const c = g.items.filter(it => caught.has(it.i)).length;

    const head = document.createElement("button");
    head.className = "gen";
    head.innerHTML = '<span class="gen-t">Generation ' + g.g +
      '<span class="gen-r">#' + g.lo + '–' + g.hi + '</span></span>' +
      '<span class="gen-c">' + c + '/' + g.items.length + '</span>';
    panel.appendChild(head);

    const wrap = document.createElement("div");
    wrap.className = "rows" + ((open.has(g.g) || query || gameF || filter === "blocked") ? " open" : "");
    head.addEventListener("click", () => {
      open.has(g.g) ? open.delete(g.g) : open.add(g.g);
      wrap.classList.toggle("open");
    });

    vis.forEach(it => {
      const row = document.createElement("button");
      row.className = "row" + (caught.has(it.i) ? " done" : "");
      row.setAttribute("aria-pressed", caught.has(it.i));
      row.innerHTML = '<span class="box">' + TICK + '</span><span class="body">' +
        '<span class="name"><span class="num">' + String(it.i).padStart(3,"0") + '</span>' +
        esc(it.n) + '</span>' + detail(it) + '</span>';
      row.addEventListener("click", () => {
        caught.has(it.i) ? caught.delete(it.i) : caught.add(it.i);
        row.classList.toggle("done");
        row.setAttribute("aria-pressed", caught.has(it.i));
        head.querySelector(".gen-c").textContent =
          g.items.filter(x => caught.has(x.i)).length + "/" + g.items.length;
        updateTop(); save();
      });
      wrap.appendChild(row);
    });
    panel.appendChild(wrap);
  });
  if(!shown) panel.innerHTML =
    '<div class="empty">Nothing matches. Try a different name or number, clear the game filter, or switch back to All.</div>';
  updateTop();
}

$("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("game").addEventListener("change", e => { gameF = e.target.value; render(); });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
}));
$("backup").addEventListener("click", exportProgress);
$("reset").addEventListener("click", async () => {
  caught.clear(); render(); await save(); setStatus("Cleared");
});

(async () => { await load(); render(); setStatus(caught.size ? "Progress restored" : "Ready"); })();
</script>
</body>
</html>
